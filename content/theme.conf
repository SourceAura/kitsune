[General]
# Kitsune lock theme settings.
#
# AllowUppercaseLettersInUsernames: the greeter's username rule.
# With it false, the name is lowered before it is passed to PAM.
AllowUppercaseLettersInUsernames=false
#
# The mantra gate: a sequence gate in front of the password field.
# WORK IN PROGRESS: the gate is still under construction. The
# password login it stands in front of is finished and unaffected.
# MantraGate=true stands the gate: the seven folds are dealt
# shuffled at every showing and answered, by slot number, typed
# or tapped, in your MantraOrder before the field opens.
# MantraOrder names the seven folds (truth, power, wisdom,
# judgment, life, love, discipline) in your order.
# Shipped off, with the canon order as the example.
MantraGate=false
MantraOrder=truth,power,wisdom,judgment,life,love,discipline
#
# MantraAttempts: wrong sequences allowed before the gate stands
# down to the password field for the rest of the showing.
MantraAttempts=3
#
# MantraPass: leave empty. When set, a right sequence logs in
# directly with this key instead of opening the password field.
# It is your password in plain text; set it only where this file
# is private (chmod 600), or not at all.
MantraPass=
